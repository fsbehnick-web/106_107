<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#1a1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
// Применяем сохранённую тему как можно раньше — до отрисовки, чтобы не было
// вспышки дефолтной темы (и цвета строки браузера, который ей не соответствует)
// при перезаходе на сайт.
(function(){
  try{
    var saved = localStorage.getItem('schedule-theme-106-107');
    var resolved = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      // Без сохранённого выбора раньше всегда стартовала тёмная "Мокко".
      // Теперь, если у пользователя в системе включена светлая тема,
      // по умолчанию показываем светлую "Терракоту".
      ? 'terracotta' : null);
    if(resolved){
      document.documentElement.setAttribute('data-theme', resolved);
    }
    var meta = document.getElementById('themeColorMeta');
    if(meta) meta.setAttribute('content', resolved === 'terracotta' ? '#f1e3d0' : '#1a1512');
  }catch(e){}
})();
</script>
<title>Расписание — группы 106 и 107</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Мокко — базовая тема (без data-theme), тёмная: эспрессо-шоколад +
     карамель + бордо, в духе трендов 2026 (Pantone Mocha Mousse,
     Benjamin Moore Silhouette). */
  :root{
    --bg: #1a1512;
    --panel: #241d17;
    --panel-2: #2c231c;
    --line: #3d3025;
    --g106: #d3a86a;
    --g106-dim: #a17f4d;
    --g106-soft: rgba(211,168,106,0.12);
    --g107: #9c2f45;
    --g107-dim: #722236;
    --g107-soft: rgba(156,47,69,0.15);
    --text: #f0e4d4;
    --text-dim: #a4907a;
    --free: #8fbf7a;
    /* Метки чётности недели (числитель/знаменатель) для регулярного периода
       (14.09–30.12). Специально не тёплые золото/бордо — это цвета самих
       групп 106/107, и путать чётность недели с принадлежностью к группе
       нельзя. Остаёмся в той же тёплой земляной гамме (оливково-табачный /
       пыльно-сливовый), просто на другом цветовом круге. */
    --parity-1: #9c8a4e;
    --parity-1-soft: rgba(156,138,78,0.16);
    --parity-2: #7d6a8f;
    --parity-2-soft: rgba(125,106,143,0.18);
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.6);
    --ease: cubic-bezier(.22,1,.36,1);
    /* Часто повторяющиеся пары transition. Подставляются через var() только
       туда, где длительность совпадает 1-в-1 — ни один селектор не потерял
       свой полный список transition-свойств (важно из-за истории с
       !important выше), поведение не меняется, просто меньше дублирования
       буквального текста "color .3s var(--ease)" по файлу. */
    --t-color: color .3s var(--ease);
    --t-bg: background-color .3s var(--ease);
  }
  /* Терракота — светлая, глина/хаки + терракотовый (в духе трендов 2026:
     Universal Khaki, terracotta & clay). */
  :root[data-theme="terracotta"]{
    --bg: #f1e3d0;
    --panel: #faf3e6;
    --panel-2: #ecdcc3;
    --line: #ddc6a4;
    --g106: #6b5a3a;
    --g106-dim: #8f7c56;
    --g106-soft: rgba(107,90,58,0.10);
    --g107: #b1512f;
    --g107-dim: #8a3e24;
    --g107-soft: rgba(177,81,47,0.12);
    --text: #382d1e;
    --text-dim: #83725a;
    --free: #5f7a43;
    --parity-1: #7a6b35;
    --parity-1-soft: rgba(122,107,53,0.12);
    --parity-2: #6b5578;
    --parity-2-soft: rgba(107,85,120,0.12);
    --shadow: 0 10px 26px -14px rgba(90,55,20,0.25);
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    transition: background-color .4s var(--ease), var(--t-color);
  }
  .wrap{max-width: 800px; margin: 0 auto;}

  /* Раньше здесь было общее правило transition с !important на несколько
     селекторов сразу. В CSS !important заменяет ВЕСЬ список transition-свойств
     целиком, а не объединяется с локальными правилами — из-за этого подъём
     карточек при hover, пульсация активной даты и подсветка "текущей пары"
     переставали анимироваться. Теперь каждый селектор ниже сам перечисляет
     полный список нужных ему transition-свойств (цвета темы + свои эффекты). */

  @keyframes dropIn{
    from{ opacity:0; transform: translateY(-10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes slotIn{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes pillPop{
    0%{ transform: scale(.90); }
    55%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .drop-in{
    opacity:0;
    animation: dropIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .drop-in.d1{ animation-delay: .04s; }
  .drop-in.d2{ animation-delay: .1s; }
  .drop-in.d3{ animation-delay: .16s; }
  .rise-in{
    opacity:0;
    animation: riseIn .45s var(--ease) forwards;
    will-change: opacity, transform;
  }
  .rise-in.d1{ animation-delay: .14s; }
  .rise-in.d2{ animation-delay: .2s; }
  .rise-in.d3{ animation-delay: .26s; }

  .board-header{
    text-align:center;
    padding: 6px 10px 26px;
    margin-bottom: 20px;
    position:relative;
  }
  .board-header::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform: translateX(-50%);
    width:64px; height:2px;
    background: linear-gradient(90deg, var(--g106), var(--g107));
    border-radius: 2px;
    opacity:.55;
    transition: background-image .35s var(--ease);
  }
  .board-header .kicker{
    letter-spacing: 2.5px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight:600;
    text-transform:uppercase;
  }
  .board-header h1{
    font-weight: 800;
    font-size: clamp(26px, 6vw, 36px);
    margin: 8px 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(100deg, var(--g106) 20%, var(--text) 55%, var(--g107) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: background-image .4s var(--ease);
  }
  .board-header p{
    margin:0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  /* Раньше жил внутри board-header, по центру под заголовком. Теперь это
     плавающий контрол в верхнем правом углу окна — тот же язык, что у
     scroll-top-btn/scroll-today-btn (панель с рамкой и тенью), только
     сверху, а не снизу — так тема доступна в один тап независимо от того,
     насколько далеко прокручена страница. */
  .theme-switcher{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 60;
    margin-top: 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    transition: background-color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
  }
  .theme-swatch{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    background: var(--panel-2);
    background-clip: padding-box;
    transition: border-color .25s var(--ease), transform .15s var(--ease), box-shadow .25s var(--ease);
  }
  .theme-swatch:hover{ transform: translateY(-2px) scale(1.06); will-change: transform; }
  .theme-swatch:active{ transform: translateY(0) scale(.94); }
  .theme-swatch.active{
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text-dim);
  }

  /* Переключатель группы: показать обе колонки или сфокусироваться на одной.
     Тот же язык сегментированного контрола, что и у theme-switcher, просто
     с текстовыми подписями вместо цветных кружков — тут важно название
     группы, а не превью палитры. */
  .group-switcher{
    margin-top: 12px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 7px;
  }
  .group-btn{
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: border-color .2s var(--ease), color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
  }
  .group-btn:hover{ transform: translateY(-1px); }
  .group-btn:active{ transform: translateY(0) scale(.95); }
  .group-btn.active[data-group="106"]{ border-color: var(--g106); color: var(--g106); background: var(--g106-soft); }
  .group-btn.active[data-group="107"]{ border-color: var(--g107); color: var(--g107); background: var(--g107-soft); }
  .group-btn.active[data-group="both"]{ border-color: var(--text-dim); color: var(--text); background: var(--panel); }

  /* Строка навигации по неделям — заменяет собой одну сплошную ленту дат на
     весь семестр (108+ дней плохо скроллятся и плохо ищутся). Лента дат
     ниже теперь показывает только текущую неделю (Пн–Вс), а сюда вынесены
     переключение недель и быстрый переход по произвольной дате. */
  .week-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 10px;
  }
  .week-arrow, .calendar-btn{
    flex: 0 0 auto;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size:14px;
    line-height:1;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    display:flex; align-items:center; justify-content:center;
    transition: color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease), opacity .2s var(--ease), background-color .25s var(--ease);
  }
  .week-arrow:hover, .calendar-btn:hover{ color: var(--text); border-color: var(--g106-dim); }
  .week-arrow:active, .calendar-btn:active{ transform: scale(.92); }
  .week-arrow:disabled{ opacity:.35; cursor:default; }
  .week-arrow:disabled:hover{ color: var(--text-dim); border-color: var(--line); }
  .week-label{
    flex: 1 1 auto;
    min-width:0;
    text-align:center;
    font-size:12.5px;
    font-weight:700;
    color: var(--text-dim);
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition: var(--t-color);
  }
  .week-label .parity-chip{
    flex:0 0 auto;
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    padding:2px 8px;
    border-radius:20px;
  }
  .week-label .parity-chip.p1{ color: var(--parity-1); background: var(--parity-1-soft); }
  .week-label .parity-chip.p2{ color: var(--parity-2); background: var(--parity-2-soft); }

  /* Лента дат — горизонтальная прокручиваемая полоса на 7 дней текущей
     недели (Пн–Вс). Раньше пробовали жёсткую сетку в 7 колонок без скролла,
     но с тремя строками в карточке (число/месяц/день недели) она выглядит
     тесной на узких экранах — вернули скролл, карточки получили комфортную
     минимальную ширину и переносятся за край экрана, кто не влез. */
  .date-rail{
    display:flex;
    gap:7px;
    padding: 4px 2px 14px;
    margin-bottom: 4px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .date-rail::-webkit-scrollbar{ display:none; }
  .date-pill{
    position:relative;
    flex: 0 0 auto;
    width: 58px;
    scroll-snap-align: center;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 10px;
    padding: 8px 2px 7px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    text-align:center;
    line-height:1.3;
    transition: border-color .25s var(--ease), color .25s var(--ease), transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s var(--ease), background-color .25s var(--ease);
  }
  .date-pill:hover{ transform: translateY(-2px); border-color: var(--g106-dim); will-change: transform; }
  .date-pill:active{ transform: translateY(0) scale(.96); }
  .date-pill b{display:block; font-size:16px; color: var(--text); font-weight:800; margin-bottom:1px; transition: color .25s var(--ease);}
  .date-pill .pill-month{display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color: var(--text-dim); margin-bottom:3px; transition: color .25s var(--ease);}
  .date-pill.active{
    border-color: var(--g106);
    color: var(--g106);
    background: var(--g106-soft);
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.35);
  }
  .date-pill.active b, .date-pill.active .pill-month{color: var(--g106);}
  .date-pill.off b{color: var(--text-dim);}
  .date-pill.pop{ animation: pillPop .4s cubic-bezier(.34,1.56,.64,1); }

  /* Бейдж чётности недели на плашке даты — только для регулярного периода
     (14.09+). Цвет ЗАВЕДОМО дублируется буквой (Ч/З), а не полагается
     только на оттенок — иначе не различить дальтонику и не считать при
     печати в ч/б. Верхний левый угол: верхний правый уже занят точкой
     "сегодня" (.date-pill.today), так что коллизии нет. */
  .date-pill .parity-tag{
    position:absolute;
    top:4px; left:5px;
    font-size:7px;
    font-weight:800;
    letter-spacing:.1px;
    line-height:1;
    transition: var(--t-color);
  }
  .date-pill .parity-tag.p1{ color: var(--parity-1); }
  .date-pill .parity-tag.p2{ color: var(--parity-2); }

  .day-title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin: 0 0 18px;
    position:relative;
  }
  .day-title{
    font-size: 14.5px;
    font-weight:600;
    color: var(--text-dim);
    text-align:center;
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: var(--t-color), opacity .22s var(--ease);
  }
  .day-title.swapping{ opacity: 0; }
  .day-title-chip{
    display:inline-block;
    margin-left:8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:none;
    padding:2px 9px;
    border-radius:20px;
    vertical-align:middle;
  }
  .day-title-chip.p1{ color: var(--parity-1); background: var(--parity-1-soft); }
  .day-title-chip.p2{ color: var(--parity-2); background: var(--parity-2-soft); }
  .today-btn{
    position:absolute;
    right:0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 20px;
    font-family:inherit;
    font-size: 11px;
    font-weight:700;
    letter-spacing: .3px;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    opacity:0;
    pointer-events:none;
    transform: translateY(-50%) scale(.9);
    top:50%;
    transition: opacity .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
  }
  .today-btn.show{
    opacity:1;
    pointer-events:auto;
    transform: translateY(-50%) scale(1);
  }
  .today-btn:hover{ color: var(--text); border-color: var(--g106-dim); }
  .today-btn:active{ transform: translateY(-50%) scale(.94); }

  /* Точка "сегодня": статичная точка (::after) + пульсирующее кольцо (::before).
     Кольцо анимируется только через transform/opacity — это чистый композитинг
     (без перерисовки каждый кадр), в отличие от прежней анимации box-shadow. */
  .date-pill.today::after{
    content:"";
    position:absolute;
    top:5px; right:5px;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--g107);
    z-index:1;
    transition: var(--t-bg);
  }
  .date-pill.today::before{
    content:"";
    position:absolute;
    top:5px; right:5px;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--g107);
    animation: todayPulse 2.2s ease-out infinite;
    will-change: transform, opacity;
    transition: var(--t-bg);
  }
  .date-pill.today.active::after,
  .date-pill.today.active::before{ background: var(--bg); }
  @keyframes todayPulse{
    0%{ transform: scale(1); opacity:.5; }
    70%{ transform: scale(2.6); opacity:0; }
    100%{ transform: scale(2.6); opacity:0; }
  }

  .content-swap{
    transition: opacity .26s var(--ease), transform .26s var(--ease);
  }
  .content-swap.swapping{ opacity:0; transform: translateY(6px) scale(.99); }

  .columns{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 560px){
    .columns{grid-template-columns: 1fr;}
  }
  /* Режим "одна группа": переключатель group-switcher скрывает вторую
     колонку и растягивает первую на всю ширину, независимо от того, что бы
     сделал брейкпоинт выше по ширине экрана. */
  .columns.single{ grid-template-columns: 1fr; }
  .col.hidden{ display:none; }

  .col{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
    box-shadow: var(--shadow);
    transition: background-color .35s var(--ease), border-color .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .col:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 34px -14px rgba(0,0,0,0.5);
    will-change: transform;
  }
  .col-head{
    padding: 13px 16px;
    font-weight:700;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    transition: var(--t-color);
  }
  .col-head::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:3px;
    transition: background-image .35s var(--ease);
  }
  .col.g106 .col-head{ color: var(--g106); }
  .col.g106 .col-head::before{ background: linear-gradient(90deg, var(--g106-dim), var(--g106)); }
  .col.g107 .col-head{ color: var(--g107); }
  .col.g107 .col-head::before{ background: linear-gradient(90deg, var(--g107-dim), var(--g107)); }
  .col-head .free-tag{
    font-size:11px;
    color: var(--free);
    font-weight:600;
  }

  /* Ленточный (agenda) режим для одиночной группы: вместо одного дня —
     непрерывная прокручиваемая лента ближайших дней внутри колонки. Каждый
     день — свой мини-заголовок (дата + день недели) и свои пары под ним. */
  .feed-day{
    border-bottom: 1px solid var(--line);
  }
  .feed-day:last-child{ border-bottom:none; }
  .feed-day-head{
    padding: 9px 16px 5px;
    font-size: 11px;
    font-weight:800;
    letter-spacing:.6px;
    text-transform:uppercase;
    color: var(--text-dim);
    background: var(--panel-2);
    display:flex;
    align-items:center;
    gap:8px;
    position: sticky;
    top: 0;
    z-index: 2;
    transition: var(--t-color), var(--t-bg);
  }
  .feed-day-head.is-today{ color: var(--g107); }
  .feed-day-head .fd-chip{
    font-size:9px;
    font-weight:800;
    padding:1px 7px;
    border-radius:20px;
    text-transform:none;
    letter-spacing:.3px;
  }
  .feed-day-head .fd-chip.p1{ color: var(--parity-1); background: var(--parity-1-soft); }
  .feed-day-head .fd-chip.p2{ color: var(--parity-2); background: var(--parity-2-soft); }
  .feed-day-head .fd-free{
    margin-left: auto;
    color: var(--free);
    font-weight:700;
    font-size:10px;
    text-transform:none;
    letter-spacing:.2px;
    white-space:nowrap;
  }
  .feed-empty{
    padding: 14px 16px;
    color: var(--free);
    font-size:12.5px;
    font-weight:600;
  }

  .slot{
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    font-size: 13px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    animation: slotIn .4s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 0.045s);
    will-change: opacity, transform;
    transition: var(--t-bg), border-left-color .3s var(--ease), padding-left .3s var(--ease);
  }
  .slot:hover{ background: var(--panel-2); }
  .slot:last-child{border-bottom:none;}
  .slot.now{
    background: var(--g107-soft);
    border-left-color: var(--g107);
    padding-left: 13px;
  }
  .slot.now .time{ color: var(--g107); }
  .slot .time-left{
    display:block;
    margin-top:3px;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.5px;
    color: var(--g107);
    transition: var(--t-color);
  }
  .slot.past{ opacity:.5; }

  .slot .time{
    color: var(--text-dim);
    flex: 0 0 84px;
    font-size:12px;
    font-weight:600;
    padding-top:1px;
    transition: var(--t-color);
  }
  .slot .what b{display:block; color: var(--text); font-size:13px; font-weight:600; transition: var(--t-color);}
  .slot .what span{color: var(--text-dim); font-size:12px; transition: var(--t-color);}
  .empty-day{
    padding: 26px 14px;
    text-align:center;
    color: var(--free);
    font-size:13px;
    font-weight:600;
    animation: slotIn .45s var(--ease) both;
  }

  .sheet-scrim{
    position: fixed;
    inset: 0;
    cursor: pointer;
    background: rgba(0,0,0,0.5);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s var(--ease);
    z-index: 998;
  }
  .sheet-scrim.open{ opacity:1; pointer-events:auto; }

  .detail-sheet{
    position: fixed;
    left: 50%;
    bottom: 0;
    width: min(92vw, 460px);
    max-height: 62vh;
    max-height: 62dvh;
    transform: translate(-50%, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -14px 40px -12px rgba(0,0,0,0.5);
    padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 999;
    transition: transform .32s cubic-bezier(.22,1,.36,1);
  }
  .detail-sheet.open{ transform: translate(-50%, 0); }
  .detail-sheet.dragging{ transition: none; }
  .detail-sheet.g106 .sheet-time{ color: var(--g106); }
  .detail-sheet.g107 .sheet-time{ color: var(--g107); }
  .detail-sheet.g106 .sheet-meta span::before{ background: var(--g106); }
  .detail-sheet.g107 .sheet-meta span::before{ background: var(--g107); }

  .sheet-grabber{
    width: 40px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
    margin: 4px auto 14px;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .sheet-close{
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    transition: color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .sheet-close:hover{ color: var(--text); border-color: var(--g106-dim); }
  .sheet-close:active{ transform: scale(.92); }
  .sheet-header{
    cursor: grab;
    /* Не pan-y: заголовок не прокручиваемая область, и allow-панорамирование
       иногда даёт браузеру забрать вертикальный жест под нативный скролл
       раньше, чем до JS дойдут pointermove — из-за этого свайп-закрытие
       мог не сработать с первого раза на touch-устройствах. none здесь
       ведёт себя как на .sheet-grabber и отдаёт весь жест перетаскиванию. */
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .sheet-body{
    max-height: calc(62vh - 60px);
    max-height: calc(62dvh - 60px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  .sheet-time{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    transition: var(--t-color);
  }
  .sheet-title{
    margin: 6px 0 14px;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
  }
  .sheet-meta{
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .sheet-meta span{
    position: relative;
    padding-left: 16px;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.4;
    transition: var(--t-color);
  }
  .sheet-meta span::before{
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: var(--t-bg);
  }

  /* Шторка-календарь для быстрого перехода на произвольную дату в диапазоне
     01.09–30.12 — тот же компонент .detail-sheet (анимация выезда, свайп
     закрытия), просто выше и с другим содержимым внутри .sheet-body. */
  .detail-sheet.cal-sheet{
    max-height: 78vh;
    max-height: 78dvh;
  }
  .detail-sheet.cal-sheet .sheet-body{
    max-height: calc(78vh - 60px);
    max-height: calc(78dvh - 60px);
  }
  .cal-month{ margin-bottom: 18px; }
  .cal-month:last-child{ margin-bottom: 4px; }
  .cal-month-title{
    font-size:12.5px;
    font-weight:800;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin: 0 0 10px;
    transition: var(--t-color);
  }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:6px;
  }
  .cal-day{
    position:relative;
    border:1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family:inherit;
    border-radius:9px;
    font-size:12.5px;
    font-weight:700;
    padding:8px 0 7px;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select:none;
    user-select:none;
    transition: border-color .2s var(--ease), color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
  }
  .cal-day:hover{ border-color: var(--g106-dim); transform: translateY(-1px); }
  .cal-day:active{ transform: translateY(0) scale(.94); }
  .cal-day.current{ border-color: var(--g106); color: var(--g106); background: var(--g106-soft); }
  .cal-day.p1{ box-shadow: inset 0 -3px 0 var(--parity-1); }
  .cal-day.p2{ box-shadow: inset 0 -3px 0 var(--parity-2); }
  .cal-day.holiday{ opacity:.55; border-style: dashed; }
  .cal-day.today::after{
    content:"";
    position:absolute;
    bottom:4px; left:50%;
    transform: translateX(-50%);
    width:4px; height:4px;
    border-radius:50%;
    background: var(--g107);
  }

  /* Плавающая кнопка "наверх" — появляется после прокрутки вниз, полезна
     в первую очередь в ленточном режиме с длинной лентой дней, но работает
     в любом режиме, раз страница прокручена достаточно далеко. */
  .scroll-top-btn{
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom) + 12px);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-dim);
    font-size: 17px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px) scale(.9);
    z-index: 500;
    transition: opacity .25s var(--ease), transform .25s var(--ease), border-color .2s var(--ease), color .2s var(--ease), background-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  .scroll-top-btn.show{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  .scroll-top-btn:hover{ color: var(--text); border-color: var(--g106-dim); }
  .scroll-top-btn:active{ transform: translateY(0) scale(.92); }

  /* Плавающая кнопка "к сегодня" — рядом с кнопкой "наверх", только в
     ленточном режиме (в обычном режиме для этого уже есть today-btn рядом
     с заголовком дня). Пилюля пошире круглой кнопки — нужен текст, а не
     только иконка, иначе назначение неочевидно. */
  .scroll-today-btn{
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    bottom: calc(max(20px, env(safe-area-inset-bottom) + 12px) + 52px);
    padding: 0 16px;
    height: 38px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--g107);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .2px;
    white-space: nowrap;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px) scale(.9);
    z-index: 500;
    transition: opacity .25s var(--ease), transform .25s var(--ease), border-color .2s var(--ease), background-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  .scroll-today-btn.show{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  .scroll-today-btn:hover{ border-color: var(--g107-dim); }
  .scroll-today-btn:active{ transform: translateY(0) scale(.94); }

  /* Адаптация для широких экранов: больше воздуха в сетке и карточках,
     чуть более просторная типографика для чтения с расстояния ноутбука,
     и деталь пары открывается по центру экрана как обычный диалог, а не
     мобильной шторкой снизу — тянуть её за ручку на десктопе незачем,
     поэтому сама ручка прячется, а перетаскивание отключается в JS
     (см. isDesktopSheetLayout в initSheetDrag). */
  @media (min-width: 900px){
    .wrap{ max-width: 920px; }
    .columns{ gap: 18px; }
    .col{ border-radius: 16px; }
    .col-head{ padding: 15px 20px; font-size: 15px; }
    .slot{ padding: 12px 20px; }
    .feed-day-head{ padding: 11px 20px 6px; }
    .theme-switcher{ padding: 7px 9px; gap: 9px; }
    .theme-swatch{ width: 28px; height: 28px; }

    .detail-sheet{
      left: 50%;
      top: 50%;
      bottom: auto;
      border-radius: 20px;
      border-bottom: 1px solid var(--line);
      transform: translate(-50%, calc(-50% + 16px));
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.55);
      transition: transform .3s var(--ease), opacity .3s var(--ease);
    }
    .detail-sheet.open{
      transform: translate(-50%, -50%);
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-grabber{ display: none; }
    .sheet-header{ cursor: default; }
  }

  @media print{
    /* Расписание логично распечатать: убираем декоративную анимацию,
       фон и интерактивные элементы, оставляем только сами пары. */
    body{ background:#fff !important; color:#000 !important; padding:0; }
    .theme-switcher, .group-switcher, .today-btn, .week-nav, .sheet-scrim, .detail-sheet, .scroll-top-btn, .scroll-today-btn{ display:none !important; }
    .date-rail{ overflow:visible; }
    .col{ box-shadow:none; border:1px solid #999; break-inside: avoid; }
    .slot{ animation:none !important; opacity:1 !important; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  }
</style>
</head>

</div>

<div class="sheet-scrim" id="sheetScrim" onclick="closeSheet()"></div>

</div>

<script>
// Занятия, общие для обеих групп (вступительные лекции 1–2 сентября,

// g106 и g107 — если бы поменялась аудитория или время, пришлось бы
// исправлять в двух местах, и рано или поздно копии разошлись бы незаметно.

// что у групп реально различается.
const sharedSchedule = {

    {t:"12:40–14:10", w:"Знакомство с ЭБС МПГУ", d:"Курицына Т.В. · ауд. 301"}
  ],
  "2026-09-02": [
    {t:"09:00–10:30", w:"Знакомство со студ. самоуправлением и профсоюзом", d:"Горпенко К.Д., Корноухова Д.Д. · ауд. 402"},
    {t:"10:40–12:10", w:"МПГУ – не только учёба", d:"Гульянц С.С., представители УВР · ауд. 402"},
    {t:"12:40–14:10", w:"Геометрия", d:"лекция · доц. Никифорова А.В. · ауд. 401"},
    {t:"14:20–15:50", w:"Математический анализ", d:"лекция · проф. Матвеев Е.М. · ауд. 401"}
  ],
  "2026-09-04": [
    {t:"10:40–12:10", w:"Учимся учиться", d:"доц. Чуйкова Н.В. · ауд. 401"},
    {t:"12:40–14:10", w:"Основы российской государственности", d:"лекция · доц. Максимова Л.Н. · ауд. 402"},
    {t:"14:20–15:50", w:"Основы российской государственности", d:"лекция · доц. Максимова Л.Н. · ауд. 402"}
  ],
  "2026-09-05": [
    {t:"09:00–15:50", w:"Встречи с кураторами-студентами", d:"весь день · День кураторов"}
  ],
  // Ниже — пары, которые раньше были дословно продублированы в own106 и
  // own107 на одну и ту же дату/время (лекции для потока целиком, просто

function isoPlusDays(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatWeekRange(startIso, endIso){
  const s = new Date(startIso + "T00:00:00");
  const e = new Date(endIso + "T00:00:00");
  if(s.getMonth() === e.getMonth()){
    return `${s.getDate()}–${e.getDate()} ${MONTH_SHORT_RU[s.getMonth()]}`;
  }
  return `${s.getDate()} ${MONTH_SHORT_RU[s.getMonth()]} – ${e.getDate()} ${MONTH_SHORT_RU[e.getMonth()]}`;
}

const REGULAR_ANCHOR = "2026-09-14"; // понедельник, неделя-числитель

function weekTypeFor(dateISO){
  const anchor = new Date(REGULAR_ANCHOR + "T00:00:00");
  const d = new Date(dateISO + "T00:00:00");
  const diffDays = Math.round((d - anchor) / 86400000);
  const weekIndex = Math.floor(diffDays / 7);
  const evenWeek = ((weekIndex % 2) + 2) % 2 === 0; // корректный модуль и для дат до анкера
  return evenWeek ? 1 : 2;
}

function buildRegularDaySchedule(group, dateISO){
  const weekday = weekdayIndex(dateISO);
  const dayTemplate = (weeklyTemplate[group] && weeklyTemplate[group][weekday]) || [];
  const parity = weekTypeFor(dateISO);
  const fromTemplate = dayTemplate.filter(it=>{
    if(it.week !== "all" && it.week !== parity) return false;
    if(it.until && dateISO > it.until) return false;
    return true;
  });
  const oneOff = (singleExceptions[group] && singleExceptions[group][dateISO]) || [];
  return [...fromTemplate, ...oneOff].sort((a,b)=>{
    const ra = parseRange(a.t), rb = parseRange(b.t);
    if(!ra || !rb) return 0;
    return ra[0]-rb[0];
  });
}

function getDaySchedule(group, dateISO){
  if(isHoliday(dateISO)) return [];
  if(dateISO < REGULAR_START){
    const store = group === 'g106' ? g106 : g107;
    return store[dateISO] || [];
  }
  if(dateISO > REGULAR_END) return [];
  return buildRegularDaySchedule(group, dateISO);
}

const MOSCOW_TZ = 'Europe/Moscow';

function todayISO(){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: MOSCOW_TZ, year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(new Date());
  const map = {};
  parts.forEach(p=>{ map[p.type] = p.value; });
  return `${map.year}-${map.month}-${map.day}`;
}
let TODAY = todayISO();

function pickInitialDate(){
  if(dateList.some(([iso])=>iso===TODAY)) return TODAY;
  if(TODAY < dateList[0][0]) return dateList[0][0];
  return dateList[dateList.length-1][0];
}
let currentDate = pickInitialDate();

function weekdayIndex(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.getDay();
}

function getWeekStart(iso){
  const wd = weekdayIndex(iso); // 0=Вс..6=Сб
  const mondayOffset = wd === 0 ? -6 : 1 - wd;
  return isoPlusDays(iso, mondayOffset);
}

function firstStart(items){
  if(!items || items.length===0) return null;
  const first = items[0];
  const parts = first.t.split(/[-–—]/);
  return parts.length===2 ? parts[0].trim() : null;
}

function lastEnd(items){
  if(!items || items.length===0) return null;
  const last = items[items.length-1];
  const parts = last.t.split(/[-–—]/);
  return parts.length===2 ? parts[1].trim() : null;
}

function freeWindowsText(items){
  if(items.length===0) return "весь день";
  const start = firstStart(items);
  const end = lastEnd(items);
  if(!start || !end) return null;
  return `с ${start} до ${end}`;
}

    const isEmptyDay = g106Items.length===0 && g107Items.length===0 && !allDayEventDates.has(iso);
    const isRegular = iso >= REGULAR_START;
    const parity = isRegular ? weekTypeFor(iso) : null;
    const holidayName = HOLIDAYS[iso];
    const pill = document.createElement('div');
    pill.className = 'date-pill'
      + (iso===currentDate ? ' active':'')
      + (isEmptyDay ? ' off':'')
      + (iso===TODAY ? ' today':'');
    pill.dataset.iso = iso;
    pill.setAttribute('role','tab');
    pill.setAttribute('aria-selected', iso===currentDate ? 'true':'false');
    pill.tabIndex = iso===currentDate ? 0 : -1;
    pill.title = (iso===TODAY ? `${dayNum(iso)} ${monthShort(iso)} — сегодня` : `${dayNum(iso)} ${monthShort(iso)}`)
      + (isRegular ? ` · ${parity===1?'числитель':'знаменатель'}` : '')
      + (holidayName ? ` · ${holidayName}` : '');
    const parityTagHtml = isRegular
      ? `<span class="parity-tag ${parity===1?'p1':'p2'}">${parity===1?'Ч':'З'}</span>`
      : '';
    pill.innerHTML = `${parityTagHtml}<b>${dayNum(iso)}</b><span class="pill-month">${monthShort(iso)}</span>${wd}`;
    const select = ()=>{ if(iso!==currentDate){ currentDate = iso; goToDate(); } };
    pill.onclick = select;
    pill.onkeydown = (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); select(); }
    };
    frag.appendChild(pill);
  }
  dom.rail.innerHTML = "";
  dom.rail.appendChild(frag);
}

function updateWeekNav(){
  const weekStart = getWeekStart(currentDate);
  const weekEnd = isoPlusDays(weekStart, 6);
  const prevWeekEnd = isoPlusDays(weekStart, -1);
  const nextWeekStart = isoPlusDays(weekStart, 7);
  dom.weekPrev.disabled = prevWeekEnd < OVERALL_START;
  dom.weekNext.disabled = nextWeekStart > OVERALL_END;
  const isRegular = weekStart >= REGULAR_START;
  const rangeLabel = formatWeekRange(weekStart, weekEnd);
  const chipHtml = isRegular
    ? `<span class="parity-chip ${weekTypeFor(weekStart)===1?'p1':'p2'}">${weekTypeFor(weekStart)===1?'Ч':'З'}</span>`
    : '';
  dom.weekLabel.innerHTML = `${rangeLabel}${chipHtml}`;
}

function shiftWeek(delta){
  const weekStart = getWeekStart(currentDate);
  const weekdayOffset = Math.round((new Date(currentDate+"T00:00:00") - new Date(weekStart+"T00:00:00")) / 86400000);
  const targetWeekStart = isoPlusDays(weekStart, delta*7);
  let target = isoPlusDays(targetWeekStart, weekdayOffset);
  if(target < OVERALL_START) target = OVERALL_START;
  if(target > OVERALL_END) target = OVERALL_END;
  if(target === currentDate) return;
  currentDate = target;
  goToDate();
}

function stepDay(delta){
  const idx = dateList.findIndex(d=>d[0]===currentDate);
  const next = idx + delta;
  if(next < 0 || next >= dateList.length) return;
  currentDate = dateList[next][0];
  goToDate();
}

function replayAnim(el){
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function updateActivePill(){
  dom.rail.querySelectorAll('.date-pill').forEach(p=>{
    const isActive = p.dataset.iso === currentDate;
    p.classList.toggle('active', isActive);
    p.setAttribute('aria-selected', isActive ? 'true':'false');
    p.tabIndex = isActive ? 0 : -1;
  });
  const activePill = dom.rail.querySelector('.date-pill.active');
  if(activePill){
    replayAnim(activePill);
    activePill.classList.remove('pop');
    void activePill.offsetWidth;
    activePill.classList.add('pop');
    activePill.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }
  const showTodayBtn = currentDate !== TODAY;
  dom.todayBtn.classList.toggle('show', showTodayBtn);
  dom.todayBtn.tabIndex = showTodayBtn ? 0 : -1;
  dom.todayBtn.setAttribute('aria-hidden', String(!showTodayBtn));
}

function goToDate(){
  if(groupView !== 'both'){
    // В ленточном режиме навигация — это сам скролл; выбранная дата служит
    // только якорем, откуда лента начинает строиться при следующем render().
    render();
    return;
  }
  buildRail();
  updateActivePill();
  updateWeekNav();
  dom.daySwap.classList.add('swapping');
  dom.dayTitle.classList.add('swapping');
  window.setTimeout(()=>{
    render();
    requestAnimationFrame(()=>{
      dom.daySwap.classList.remove('swapping');
      dom.dayTitle.classList.remove('swapping');
    });
  }, 260);
}

function jumpToToday(){
  const target = pickInitialDate();
  if(target !== currentDate){
    currentDate = target;
    goToDate();
  }
}

document.addEventListener('keydown', e=>{
  if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(dom.sheet.classList.contains('open') || dom.calSheet.classList.contains('open')) return;
  if(groupView !== 'both') return;
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;

});

function minutesNow(){
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: MOSCOW_TZ, hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(new Date());
  const map = {};
  parts.forEach(p=>{ map[p.type] = p.value; });
  const h = Number(map.hour) % 24; // на случай если движок форматирует полночь как "24:00"
  return h*60 + Number(map.minute);
}

function parseRange(t){
  const parts = t.split(/[-–—]/);
  if(parts.length!==2) return null;
  const [sh,sm] = parts[0].split(":").map(Number);
  const [eh,em] = parts[1].split(":").map(Number);
  if([sh,sm,eh,em].some(Number.isNaN)) return null;
  return [sh*60+sm, eh*60+em];
}

function cleanShortDesc(str) {
  if (!str) return '';
  let cleaned = str;
  Object.keys(titlesMap).forEach(shortTitle => {
    const escaped = shortTitle.replace(/\./g, '\\.');
    const regex = new RegExp('(?:^|\\s)' + escaped + '\\s*', 'g');
    cleaned = cleaned.replace(regex, m => m.startsWith(' ') || m.startsWith('\u00A0') ? ' ' : '');
  });
  return cleaned.trim();
}

function expandMetaPart(part) {
  let res = part.trim();
  Object.entries(titlesMap).forEach(([shortTitle, fullTitle]) => {
    const escaped = shortTitle.replace(/\./g, '\\.');
    res = res.replace(new RegExp(escaped, 'g'), fullTitle);
  });
  Object.entries(teacherFullNames).forEach(([shortName, fullName]) => {
    const escaped = shortName.replace(/\./g, '\\.');
    res = res.replace(new RegExp(escaped, 'g'), fullName);
  });
  return res;
}

function formatLeft(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? `${h}ч ${m}м` : `${m}м`;
}

function computeLiveIndices(items, now){
  let nowIdx = -1, nextIdx = -1, nextStart = Infinity;
  for(let i=0;i<items.length;i++){
    const range = parseRange(items[i].t);
    if(range && now >= range[0] && now <= range[1]){ nowIdx = i; break; }
  }
  if(nowIdx === -1){
    items.forEach((it,i)=>{
      const range = parseRange(it.t);
      if(range && range[0] > now && range[0] < nextStart){
        nextStart = range[0];
        nextIdx = i;
      }
    });
  }
  return {nowIdx, nextIdx};
}

function slotHtml(it, i, group, isLive, now){
  const range = isLive ? parseRange(it.t) : null;
  let cls = "slot";
  let timeLeftHtml = '';
  if(range){
    if(now >= range[0] && now <= range[1]){
      cls += " now";
      const minutesLeft = range[1]-now;
      timeLeftHtml = `<div class="time-left">${minutesLeft>0?formatLeft(minutesLeft):'<1м'}</div>`;
    } else if(now > range[1]){
      cls += " past";
    }
  }
  const ariaLabel = `${it.t}, ${it.w}`;
  return `
    <div class="${cls}" style="--i:${i}" data-group="${group}" data-idx="${i}"
         tabindex="0" role="button" aria-haspopup="dialog" aria-label="${ariaLabel}">
      <div class="time">${it.t}${timeLeftHtml}</div>
      <div class="what"><b>${it.w}</b><span>${cleanShortDesc(it.d)}</span></div>
    </div>`;
}

function renderSlots(container, items, emptyText, group){
  if(items.length===0){
    container.innerHTML = `<div class="empty-day">${emptyText}</div>`;
    return;
  }
  const isToday = currentDate === TODAY;
  const now = isToday ? minutesNow() : null;
  container.innerHTML = items.map((it,i)=> slotHtml(it, i, group, isToday, now)).join("");
}

function refreshLiveIndicators(container, items){
  if(currentDate !== TODAY || !items.length) return;
  const now = minutesNow();
  const {nowIdx, nextIdx} = computeLiveIndices(items, now);
  container.querySelectorAll('.slot[data-idx]').forEach(el=>{
    const i = Number(el.dataset.idx);
    const range = parseRange(items[i].t);
    el.classList.remove('now','past');
    let timeLeftEl = el.querySelector('.time-left');
    if(range && i === nowIdx){
      el.classList.add('now');
      const minutesLeft = range[1] - now;
      const text = minutesLeft > 0 ? formatLeft(minutesLeft) : '<1м';
      if(!timeLeftEl){
        timeLeftEl = document.createElement('div');
        timeLeftEl.className = 'time-left';
        el.querySelector('.time').appendChild(timeLeftEl);
      }
      timeLeftEl.textContent = text;
    } else if(range && i === nextIdx){
      const minutesUntil = range[0] - now;
      const text = minutesUntil > 0 ? formatLeft(minutesUntil) : '<1м';
      if(!timeLeftEl){
        timeLeftEl = document.createElement('div');
        timeLeftEl.className = 'time-left';
        el.querySelector('.time').appendChild(timeLeftEl);
      }
      timeLeftEl.textContent = text;
    } else {
      if(range && now > range[1]) el.classList.add('past');
      if(timeLeftEl) timeLeftEl.remove();
    }
  });
}

// Ленточный (agenda) режим строит ленту по всему диапазону расписания
// (с 1 сентября), а не только вперёд от текущей даты — так пролистать
// назад к началу семестра можно тем же скроллом, а не только вперёд.
function renderFeed(container, group){
  let html = '';
  for(let idx=0; idx<dateList.length; idx++){
    const iso = dateList[idx][0];
    const items = getDaySchedule(group, iso);
    const wd = weekdayNames[weekdayIndex(iso)];
    const isRegular = iso >= REGULAR_START;
    const parity = isRegular ? weekTypeFor(iso) : null;
    const holidayName = HOLIDAYS[iso];
    const isToday = iso === TODAY;
    const chipHtml = holidayName
      ? `<span class="fd-chip p2">${holidayName}</span>`
      : (isRegular ? `<span class="fd-chip ${parity===1?'p1':'p2'}">${parity===1?'Ч':'З'}</span>` : '');
    const freeText = holidayName ? "выходной" : freeWindowsText(items);
    const freeHtml = freeText ? `<span class="fd-free">${freeText}</span>` : '';
    html += `<div class="feed-day" data-iso="${iso}">`;
    html += `<div class="feed-day-head${isToday?' is-today':''}"><span>${dayNum(iso)} ${monthShort(iso)} · ${wd}${isToday?' · сегодня':''}</span>${chipHtml}${freeHtml}</div>`;
    if(holidayName){
      html += `<div class="feed-empty">${holidayName} — занятий нет</div>`;
    } else if(items.length===0){
      html += `<div class="feed-empty">Пар нет — весь день свободна</div>`;
    } else {
      const now = isToday ? minutesNow() : null;
      html += items.map((it,i)=> slotHtml(it, i, group, isToday, now)).join("");
    }
    html += `</div>`;
  }
  container.innerHTML = html;
  container.dataset.feedGroup = group;
  const anchorIso = dateList.some(d=>d[0]===TODAY) ? TODAY : currentDate;
  const anchorBlock = container.querySelector(`.feed-day[data-iso="${anchorIso}"]`);
  if(anchorBlock){
    requestAnimationFrame(()=>{
      anchorBlock.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
}

function refreshFeedLiveIndicators(container, group){
  const todayBlock = container.querySelector(`.feed-day[data-iso="${TODAY}"]`);
  if(!todayBlock) return;
  const items = getDaySchedule(group, TODAY);
  refreshLiveIndicators(todayBlock, items);
}

function render(){
  if(groupView !== 'both'){
    const group = groupView === '106' ? 'g106' : 'g107';
    const container = group === 'g106' ? dom.g106Slots : dom.g107Slots;
    renderFeed(container, group);
    return;
  }

  const wIdx = weekdayIndex(currentDate);
  const label = dateList.find(d=>d[0]===currentDate)[1];
  const parity = currentDate >= REGULAR_START ? weekTypeFor(currentDate) : null;
  const holidayName = HOLIDAYS[currentDate];
  const holidayHtml = holidayName
    ? ` <span class="day-title-chip p2">${holidayName}</span>`
    : '';
  const parityHtml = (parity && !holidayName)
    ? ` <span class="day-title-chip ${parity===1?'p1':'p2'}">${parity===1?'Числитель':'Знаменатель'}</span>`
    : '';
  dom.dayTitle.innerHTML =
    `${label} · ${weekdayNames[wIdx]}${currentDate===TODAY ? ' · сегодня' : ''}${parityHtml}${holidayHtml}`;

  const emptyText = holidayName ? `${holidayName} — занятий нет` : "Пар нет — весь день свободна";

  const gItems = getDaySchedule('g106', currentDate);
  dayItems.g106 = gItems;
  renderSlots(dom.g106Slots, gItems, emptyText, 'g106');
  dom.g106Free.textContent = holidayName ? "выходной" : freeWindowsText(gItems);

  const hItems = getDaySchedule('g107', currentDate);
  dayItems.g107 = hItems;
  renderSlots(dom.g107Slots, hItems, emptyText, 'g107');
  dom.g107Free.textContent = holidayName ? "выходной" : freeWindowsText(hItems);
}

let lastFocused = null;

let lockedScrollY = 0;
function lockBodyScroll(){
  lockedScrollY = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${lockedScrollY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  document.body.style.overflow = '';
  window.scrollTo(0, lockedScrollY);
}

function openSlot(group, idx, sourceEl){
  // В ленточном режиме на странице может быть несколько .slot с одинаковым
  // data-idx (по одному на каждый день ленты) — поэтому пара определяется
  // по дню, к которому реально принадлежит нажатый элемент, а не по
  // текущему currentDate.
  let items;
  if(groupView !== 'both' && sourceEl){
    const dayBlock = sourceEl.closest('.feed-day');
    const iso = dayBlock ? dayBlock.dataset.iso : currentDate;
    items = getDaySchedule(group, iso);
  } else {
    items = dayItems[group];
  }
  const it = items && items[idx];
  if(!it) return;
  lastFocused = document.activeElement;

  dom.sheet.classList.remove('g106','g107');
  dom.sheet.classList.add(group);
  dom.sheetTime.textContent = it.t;
  dom.sheetTitle.textContent = it.w;
  dom.sheetMeta.innerHTML = it.sub && it.sub.length
    ? it.sub.map(s=>{
        const prefix = s.label != null ? s.label : (s.n != null ? `${s.n} гр` : '');
        const whoWhere = [s.who ? expandMetaPart(s.who) : null, s.where || null]
          .filter(Boolean).join(' · ');
        const line = whoWhere ? `${prefix}: ${whoWhere}` : prefix;
        return `<span>${line}</span>`;
      }).join("")
    : it.d.split("·").map(part=>`<span>${expandMetaPart(part)}</span>`).join("");

  dom.sheetScrim.classList.add('open');
  dom.sheet.classList.add('open');
  dom.sheet.setAttribute('aria-hidden','false');
  dom.sheet.inert = false;
  lockBodyScroll();
  dom.sheet.querySelector('.sheet-close').focus({preventScroll:true});
}

function closeSheet(){
  if(!dom.sheet.classList.contains('open')) return;
  dom.sheetScrim.classList.remove('open');
  dom.sheet.classList.remove('open');
  dom.sheet.setAttribute('aria-hidden','true');
  dom.sheet.inert = true;
  unlockBodyScroll();
  if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus({preventScroll:true});
}

function buildCalendarBody(){
  const frag = document.createDocumentFragment();
  let currentMonthKey = null;
  let gridEl = null;
  dateList.forEach(([iso, label])=>{
    const d = new Date(iso + "T00:00:00");
    const wd = d.getDay(); // 0=Вс..6=Сб
    const wdIdx = wd === 0 ? 6 : wd - 1; // 0=Пн..6=Вс, совпадает с колонками 7-колоночной сетки
    const monthKey = `${d.getFullYear()}-${d.getMonth()}`;
    if(monthKey !== currentMonthKey){
      currentMonthKey = monthKey;
      const monthBlock = document.createElement('div');
      monthBlock.className = 'cal-month';
      const title = document.createElement('div');
      title.className = 'cal-month-title';
      title.textContent = `${MONTH_FULL_RU[d.getMonth()]} ${d.getFullYear()}`;
      monthBlock.appendChild(title);
      gridEl = document.createElement('div');
      gridEl.className = 'cal-grid';
      monthBlock.appendChild(gridEl);
      frag.appendChild(monthBlock);
      for(let p=0;p<wdIdx;p++){
        gridEl.appendChild(document.createElement('div'));
      }
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    let cls = 'cal-day';
    if(iso === currentDate) cls += ' current';
    if(iso === TODAY) cls += ' today';
    if(iso >= REGULAR_START) cls += weekTypeFor(iso) === 1 ? ' p1' : ' p2';
    const holidayName = HOLIDAYS[iso];
    if(holidayName) cls += ' holiday';
    btn.className = cls;
    btn.textContent = String(d.getDate());
    btn.setAttribute('aria-label', `${label}${iso===TODAY ? ' — сегодня' : ''}${holidayName ? ' · ' + holidayName : ''}`);
    if(holidayName) btn.title = holidayName;
    btn.onclick = ()=>{
      currentDate = iso;
      closeCalSheet();
      goToDate();
    };
    gridEl.appendChild(btn);
  });
  dom.calBody.innerHTML = '';
  dom.calBody.appendChild(frag);
}

function openCalSheet(){
  buildCalendarBody();
  lastFocused = document.activeElement;
  dom.calScrim.classList.add('open');
  dom.calSheet.classList.add('open');
  dom.calSheet.setAttribute('aria-hidden','false');
  dom.calSheet.inert = false;
  lockBodyScroll();
  dom.calSheet.querySelector('.sheet-close').focus({preventScroll:true});
}

function closeCalSheet(){
  if(!dom.calSheet.classList.contains('open')) return;
  dom.calScrim.classList.remove('open');
  dom.calSheet.classList.remove('open');
  dom.calSheet.setAttribute('aria-hidden','true');
  dom.calSheet.inert = true;
  unlockBodyScroll();
  if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus({preventScroll:true});
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(dom.calSheet.classList.contains('open')) closeCalSheet();
    else if(dom.sheet.classList.contains('open')) closeSheet();
    return;
  }
  if(e.key === 'Tab'){
    const openSheetEl = dom.calSheet.classList.contains('open') ? dom.calSheet
      : (dom.sheet.classList.contains('open') ? dom.sheet : null);
    if(!openSheetEl) return;
    const focusable = openSheetEl.querySelectorAll(
      'button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    if(focusable.length === 0) return;
    const first = focusable[0], last = focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault(); last.focus();
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
  }
});

// На широких экранах шторка становится центрированным диалогом (см. CSS,
// @media (min-width: 900px)) — тянуть её за ручку вниз там не нужно и
// физически бессмысленно (нет "низа экрана", к которому она едет), поэтому
// перетаскивание в этом режиме не запускается вовсе.
const DESKTOP_SHEET_QUERY = '(min-width: 900px)';
function isDesktopSheetLayout(){
  return window.matchMedia(DESKTOP_SHEET_QUERY).matches;
}

function initSheetDrag(sheetEl, grabberEl, headerEl, closeFn){
  const DRAG_THRESHOLD = 6;
  let tracking = false, dragging = false, startY = 0, sheetHeight = 0;

  const beginTrack = (y)=>{
    tracking = true;
    dragging = false;
    startY = y;
    sheetHeight = sheetEl.getBoundingClientRect().height;
  };
  const move = (y)=>{
    if(!tracking) return;
    const delta = y - startY;
    if(!dragging){
      if(Math.abs(delta) < DRAG_THRESHOLD) return;
      dragging = true;
      sheetEl.classList.add('dragging');
    }
    sheetEl.style.transform = `translate(-50%, ${Math.max(0, delta)}px)`;
  };
  const end = (y)=>{
    if(!tracking) return;
    tracking = false;
    const delta = Math.max(0, y - startY);
    if(dragging){
      dragging = false;
      sheetEl.classList.remove('dragging');
      sheetEl.style.transform = '';
      if(delta > sheetHeight * 0.28) closeFn();
    }
  };
  grabberEl.addEventListener('pointerdown', e=>{ if(!isDesktopSheetLayout()) beginTrack(e.clientY); });
  headerEl.addEventListener('pointerdown', e=>{ if(!isDesktopSheetLayout()) beginTrack(e.clientY); });
  window.addEventListener('pointermove', e=>{ if(tracking) move(e.clientY); });
  window.addEventListener('pointerup', e=>end(e.clientY));
  window.addEventListener('pointercancel', ()=>{
    tracking = false; dragging = false;
    sheetEl.classList.remove('dragging'); sheetEl.style.transform = '';
  });
}
initSheetDrag(dom.sheet, dom.sheetGrabber, dom.sheetHeader, closeSheet);
initSheetDrag(dom.calSheet, dom.calGrabber, dom.calHeader, closeCalSheet);

// Свайп влево/вправо: по ленте дат — смена недели (та же функция, что и у
// стрелочек рядом), по блоку с парами — смена дня (та же функция, что и у
// стрелок клавиатуры). Активно только в обычном (не ленточном) режиме —
// в ленточном режиме навигация уже выполняется вертикальным скроллом.
// preventDefault нигде не вызывается, поэтому обычный вертикальный скролл
// страницы не ломается — решение "это был свайп" принимается уже
// постфактум, по итоговому смещению между pointerdown и pointerup, а не
// перехватом жеста на лету.
function initSwipe(el, {onLeft, onRight, threshold = 46, restraint = 70} = {}){
  let tracking = false, startX = 0, startY = 0;
  el.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    tracking = true;
    startX = e.clientX;
    startY = e.clientY;
  });
  const finish = (e)=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) >= threshold && Math.abs(dy) <= restraint){
      if(dx < 0) onLeft && onLeft();
      else onRight && onRight();
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', ()=>{ tracking = false; });
}
initSwipe(dom.rail, { onLeft: ()=>shiftWeek(1), onRight: ()=>shiftWeek(-1) });
initSwipe(dom.daySwap, {
  onLeft: ()=>{ if(groupView==='both') stepDay(1); },
  onRight: ()=>{ if(groupView==='both') stepDay(-1); }
});

const THEME_KEY = 'schedule-theme-106-107';
const THEMES = [
  {id:'mocha',      name:'Мокко',      bg:'#1a1512', a:'#d3a86a', b:'#9c2f45'},
  {id:'terracotta', name:'Терракота', bg:'#f1e3d0', a:'#6b5a3a', b:'#b1512f'},
];

function currentThemeId(){
  return document.documentElement.getAttribute('data-theme') || 'mocha';
}

function applyTheme(id, persist){
  document.documentElement.setAttribute('data-theme', id);
  if(persist){
    try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  }
  const themeMeta = document.getElementById('themeColorMeta');
  const themeDef = THEMES.find(t=>t.id===id);
  if(themeMeta && themeDef) themeMeta.setAttribute('content', themeDef.bg);
  dom.themeSwitcher.querySelectorAll('.theme-swatch').forEach(el=>{
    const isActive = el.dataset.theme === id;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-pressed', String(isActive));
  });
}

function buildThemeSwitcher(){
  const frag = document.createDocumentFragment();
  THEMES.forEach(t=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-swatch';
    btn.dataset.theme = t.id;
    btn.title = t.name;
    btn.setAttribute('aria-label', t.name);
    btn.setAttribute('aria-pressed', 'false');
    btn.style.background = `linear-gradient(135deg, ${t.bg} 40%, ${t.a} 70%, ${t.b} 100%)`;
    btn.onclick = ()=> applyTheme(t.id, true);
    frag.appendChild(btn);
  });
  dom.themeSwitcher.innerHTML = '';
  dom.themeSwitcher.appendChild(frag);
  applyTheme(currentThemeId(), false);
}

// Переключатель группы (106 / 107 / обе) — какая колонка(и) показывается в
// content-swap. Хранится отдельно от темы, но по тому же принципу:
// применяем сохранённый выбор сразу при построении интерфейса.
// При выборе одной группы (106/107) интерфейс переходит в ленточный
// (agenda) режим: лента дат недели и заголовок дня скрываются (навигация
// по ним больше не нужна — пролистывание идёт скроллом внутри самой
// ленты), а колонка выбранной группы растягивается на всю ширину и
// показывает подряд несколько дней вперёд.
const GROUP_KEY = 'schedule-group-view-106-107';
const GROUP_VIEWS = [
  {id:'both', label:'Обе'},
  {id:'106',  label:'106'},
  {id:'107',  label:'107'},
];

function currentGroupView(){
  try{
    const saved = localStorage.getItem(GROUP_KEY);
    if(saved && GROUP_VIEWS.some(g=>g.id===saved)) return saved;
  }catch(e){}
  return 'both';
}

function applyGroupView(view, persist){
  groupView = view;
  if(persist){
    try{ localStorage.setItem(GROUP_KEY, view); }catch(e){}
  }
  dom.columnsWrap.classList.toggle('single', view !== 'both');
  document.querySelector('.col.g106').classList.toggle('hidden', view === '107');
  document.querySelector('.col.g107').classList.toggle('hidden', view === '106');
  dom.groupSwitcher.querySelectorAll('.group-btn').forEach(btn=>{
    const isActive = btn.dataset.group === view;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', String(isActive));
  });

  const isFeed = view !== 'both';
  dom.weekNav.style.display = isFeed ? 'none' : '';
  dom.rail.style.display = isFeed ? 'none' : '';
  dom.dayTitleRow.style.display = isFeed ? 'none' : '';
  dom.scrollTodayBtn.classList.toggle('show', isFeed);
  if(isFeed){
    dom.g106Free.textContent = '';
    dom.g107Free.textContent = '';
  }

  if(isFeed){
    render();
  } else {
    buildRail();
    updateActivePill();
    updateWeekNav();
    render();
  }
}

function buildGroupSwitcher(){
  const frag = document.createDocumentFragment();
  GROUP_VIEWS.forEach(g=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'group-btn';
    btn.dataset.group = g.id;
    btn.textContent = g.label;
    btn.setAttribute('aria-pressed', 'false');
    btn.onclick = ()=> applyGroupView(g.id, true);
    frag.appendChild(btn);
  });
  dom.groupSwitcher.innerHTML = '';
  dom.groupSwitcher.appendChild(frag);
  applyGroupView(currentGroupView(), false);
}

function checkDayRollover(){
  const fresh = todayISO();
  if(fresh !== TODAY){
    const wasOnToday = currentDate === TODAY;
    TODAY = fresh;
    if(wasOnToday) currentDate = pickInitialDate();
    if(groupView === 'both'){
      buildRail();
      updateActivePill();
      updateWeekNav();
    }
    return true;
  }
  return false;
}

document.addEventListener('click', e=>{
  const slot = e.target.closest('.slot[data-group]');
  if(slot) openSlot(slot.dataset.group, Number(slot.dataset.idx), slot);
});
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const slot = e.target.closest && e.target.closest('.slot[data-group]');
  if(slot){ e.preventDefault(); openSlot(slot.dataset.group, Number(slot.dataset.idx), slot); }
});

function scrollToPageTop(){
  window.scrollTo({top:0, behavior:'smooth'});
}

function scrollToTodayInFeed(){
  if(groupView === 'both') return;
  const group = groupView === '106' ? 'g106' : 'g107';
  const container = group === 'g106' ? dom.g106Slots : dom.g107Slots;
  const anchorIso = dateList.some(d=>d[0]===TODAY) ? TODAY : currentDate;
  const target = container.querySelector(`.feed-day[data-iso="${anchorIso}"]`);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}

const SCROLL_TOP_THRESHOLD = 400;
function updateScrollTopBtn(){
  const y = window.scrollY || window.pageYOffset || 0;
  dom.scrollTopBtn.classList.toggle('show', y > SCROLL_TOP_THRESHOLD);
}
window.addEventListener('scroll', updateScrollTopBtn, {passive:true});

function initBoard(){
  buildThemeSwitcher();
  buildGroupSwitcher();
  updateScrollTopBtn();
  document.querySelectorAll('.drop-in, .rise-in').forEach(el=>{
    el.addEventListener('animationend', function handler(){
      el.classList.remove('drop-in','rise-in','d1','d2','d3');
      el.removeEventListener('animationend', handler);
    });
    window.setTimeout(()=>{
      el.classList.remove('drop-in','rise-in','d1','d2','d3');
    }, 1500);
  });
  const liveTick = ()=>{
    const dayChanged = checkDayRollover();
    if(dayChanged){
      render();
    } else if(groupView === 'both'){
      refreshLiveIndicators(dom.g106Slots, dayItems.g106);
      refreshLiveIndicators(dom.g107Slots, dayItems.g107);
    } else {
      const group = groupView === '106' ? 'g106' : 'g107';
      const container = group === 'g106' ? dom.g106Slots : dom.g107Slots;
      refreshFeedLiveIndicators(container, group);
    }
  };
  window.setInterval(liveTick, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) liveTick();
  });
}

initBoard();
</script>
